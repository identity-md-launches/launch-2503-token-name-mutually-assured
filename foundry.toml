[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [
    { access = "read", path = "./test/fixtures/UniversalRouter.json" },
    { access = "read", path = "./test/fixtures/Permit2.json" }
]

[profile.default.fuzz]
runs = 256
seed = "0x4505d2dc9770c5d9f475d85cef833894c8d9e4401e4b51235ade9e4240de895a"

[fmt]
line_length = 110
